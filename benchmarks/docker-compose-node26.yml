services:
  mock-service-node26:
    build:
      context: .
      dockerfile: apps/mock-service/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3031:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    networks:
      - nestjs-benchmark-node26

  nestjs-fastify-axios-node26:
    build:
      context: .
      dockerfile: apps/nestjs-fastify-axios/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3032:3002"
    environment:
      - PORT=3002
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

  nestjs-fastify-undici-node26:
    build:
      context: .
      dockerfile: apps/nestjs-fastify-undici/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3033:3003"
    environment:
      - PORT=3003
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

  nestjs-express-axios-node26:
    build:
      context: .
      dockerfile: apps/nestjs-express-axios/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3034:3004"
