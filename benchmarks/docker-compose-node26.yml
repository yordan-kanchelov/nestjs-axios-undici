      - PORT=3004
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

  nestjs-express-axios-interceptor-node26:
    build:
      context: .
      dockerfile: apps/nestjs-express-axios-interceptor/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3035:3005"
    environment:
      - PORT=3005
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

  nestjs-fastify-axios-interceptor-node26:
    build:
      context: .
      dockerfile: apps/nestjs-fastify-axios-interceptor/Dockerfile
      args:
        NODE_VERSION: 26
    ports:
      - "3036:3006"
    environment:
      - PORT=3006
      - MOCK_SERVICE_URL=http://mock-service-node26:3001/api/data
    depends_on:
      - mock-service-node26
    networks:
      - nestjs-benchmark-node26

  nestjs-fastify-undici-interceptor-node26:
