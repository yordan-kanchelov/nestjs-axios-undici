name: Example Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'package.json'
      - 'scripts/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'package.json'
      - 'scripts/**'

jobs:
  test-examples:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Run all tests
        run: npm test
        timeout-minutes: 10

      - name: Upload example test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-test-results-${{ matrix.node-version }}
          path: |
            examples/**/*.log
            examples/**/dist/
