name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docsify/**'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/docs.yml'
  # Called by the Release workflow after a release's benchmark results are
  # committed (commits made with GITHUB_TOKEN don't trigger push workflows).
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write


jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html README.md docs docsify _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
