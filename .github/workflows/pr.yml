name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'
      - 'docsify/**'
      - 'index.html'

permissions:
  contents: read

jobs:
  check-changeset:
    name: Verify changeset
    runs-on: ubuntu-latest
    # The release PR opened by the Release workflow consumes changesets
    if: github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check for a changeset
        run: |
          # Only changes to the published package need a changeset
          if ! git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(src/|index\.(js|ts|d\.ts)$|package\.json$|tsconfig\.json$)'; then
            echo "No package changes; changeset not required"
            exit 0
          fi
          # Changes to a version that isn't on npm yet ship with that pending release
          PKG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          if ! npm view "$PKG" version > /dev/null 2>&1; then
            echo "$PKG is not published yet; changes ride along with its release, changeset not required"
            exit 0
          fi
          if ! npx changeset status --since=origin/${{ github.base_ref }}; then
            echo "::error::This PR changes the published package but has no changeset. Run 'npx changeset' (or 'npx changeset --empty' if it should not be released) and commit the file."
            exit 1
          fi
